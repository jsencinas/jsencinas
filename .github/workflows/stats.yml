name: Update stats card

on:
  schedule:
    - cron: "17 6 * * *" # daily, 00:17 in Guadalajara
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render assets/stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/stats.py "${{ github.repository_owner }}" assets/stats.svg
      - name: Commit if changed
        run: |
          if [ -n "$(git status --porcelain assets/stats.svg)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/stats.svg
            git commit -m "Update stats card"
            git push
          fi
