  <desc id="d">Terminal: whoami. Jorge Enrique Sánchez Encinas. I build systems that work in real time. Computer Science at Tec de Monterrey, former FRC 7102 lead programmer, learning penetration testing.</desc>
  <style>
    .mono { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .sans { font-family: Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif; }
    .prompt { fill: #D9C7A0; font-size: 15px; }
    .cmd { fill: #F3F1EC; font-size: 15px; }
    .cap { fill: rgba(243,241,236,.56); font-size: 12px; letter-spacing: .08em; }
    .name { font-family: Archivo,'Helvetica Neue',Helvetica,Arial,sans-serif; font-size: 38px; font-weight: 500; letter-spacing: -0.03em; fill: #F3F1EC; }
    .frame { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 33px; letter-spacing: 0; fill: #D9C7A0; opacity: 0; animation: blip 0.07s linear forwards; }
    .final { opacity: 0; animation: on .01s linear 1.63s forwards; }
    .tag { fill: rgba(243,241,236,.82); font-size: 21px; }
    .tag .hi { fill: #D9C7A0; }
    .meta { fill: rgba(243,241,236,.56); font-size: 13px; }
    .meta .sep { fill: rgba(243,241,236,.22); }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    .cover { animation: type .6s steps(6) .35s forwards; }
    .cursor { fill: #D9C7A0; animation: blink 1.1s steps(1) infinite; }
    @keyframes blip { 0%, 99% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes on { to { opacity: 1; } }
    @keyframes type { to { transform: translateX(62px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .frame, .cover { display: none; }
      .final, .rise { opacity: 1; animation: none; }
      .cursor { animation: none; }
    }
  </style>
