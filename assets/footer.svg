  <rect x="0.5" y="0.5" width="859" height="83" rx="12" fill="#0B0C0D" stroke="rgba(243,241,236,.12)"/>
  <g class="row" style="animation-delay:0.3s">
    <text class="off" x="24" y="34">00000000:</text>
    <text class="hex" x="120" y="34">4a6f 7267 6520 456e 7269 7175 6520</text>
    <text class="asc" x="510" y="34">Jorge Enrique</text>
  </g>
  <g class="row" style="animation-delay:1.2s">
    <text class="off" x="24" y="60">0000000e:</text>
    <text class="hex" x="120" y="60">53c3 a16e 6368 657a 2045 6e63 696e 6173</text>
    <text class="asc" x="510" y="60">Sánchez Encinas</text>
