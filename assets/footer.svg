<svg xmlns="http://www.w3.org/2000/svg" width="860" height="84" viewBox="0 0 860 84" role="img" aria-label="Hex dump of the name Jorge Enrique Sánchez Encinas">
  <style>
    text { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size: 14px; }
    .off { fill: rgba(243,241,236,.30); }
    .hex { fill: #D9C7A0; }
    .asc { fill: rgba(243,241,236,.70); }
    .row { opacity: 0; animation: in .8s steps(8) forwards; }
