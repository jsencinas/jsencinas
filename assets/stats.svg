<svg xmlns="http://www.w3.org/2000/svg" width="860" height="214" viewBox="0 0 860 214" role="img" aria-label="GitHub activity for jsencinas: 224 contributions in the last year, 10 public repositories. Top languages: Python, HTML, CSS, JavaScript, C++, Lua.">
  <style>
    text { font-family: 'Geist Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; }
    .prompt { fill: #D9C7A0; font-size: 15px; }
    .cmd { fill: #F3F1EC; font-size: 15px; }
    .cap { fill: rgba(243,241,236,.50); font-size: 11px; letter-spacing: .08em; }
    .num { fill: #F3F1EC; font-size: 28px; font-weight: 500; }
    .leg { fill: rgba(243,241,236,.72); font-size: 12.5px; }
    .rise { opacity: 0; animation: rise .7s cubic-bezier(.16,1,.3,1) forwards; }
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: grow 1s cubic-bezier(.16,1,.3,1) .7s forwards; }
    .late { animation-delay: 1.1s; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes grow { to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      .rise { opacity: 1; animation: none; }
      .bar { transform: none; animation: none; }
    }
  </style>
